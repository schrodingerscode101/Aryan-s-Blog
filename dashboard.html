<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Aryan's Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <div class="masthead">
    <div class="eyebrow">Administration</div>
    <h1>Dashboard</h1>
  </div>
  <hr class="rule thick">

  <div class="admin-bar">
    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="posts">Blog Entries</button>
      <button class="tab-btn" data-tab="messages">Direct Messages</button>
    </div>
    <button id="logout-btn" class="admin-logout">Log out</button>
  </div>

  <section id="tab-posts" class="admin-tab-panel">
    <div class="admin-grid">
      <div class="admin-card">
        <h2 id="form-heading">New Entry</h2>
        <form id="post-form">
          <input type="hidden" id="post-id">

          <label for="title">Title</label>
          <input id="title" type="text" required>

          <label for="category">Category</label>
          <input id="category" type="text" list="category-suggestions" placeholder="e.g. Life, Cinema, Literature, Travel, Food...">
          <datalist id="category-suggestions">
            <option value="Life">
            <option value="Cinema">
            <option value="Literature">
          </datalist>

          <label for="excerpt">Excerpt (short summary shown on the homepage card)</label>
          <textarea id="excerpt" rows="2"></textarea>

          <label for="image-file">Cover image</label>
          <input id="image-file" type="file" accept="image/*">
          <input type="hidden" id="image-url">
          <div id="image-preview" class="image-preview"></div>

          <label for="content">Content (basic HTML like &lt;p&gt;, &lt;b&gt;, &lt;i&gt; is supported)</label>
          <textarea id="content" rows="10" required></textarea>

          <div class="form-actions">
            <button type="submit" id="save-btn">Publish Entry</button>
            <button type="button" id="cancel-edit-btn" style="display:none;">Cancel edit</button>
          </div>
          <div class="admin-status" id="post-status"></div>
        </form>
      </div>

      <div class="admin-card">
        <h2>Existing Entries</h2>
        <div id="posts-list"></div>
      </div>
    </div>
  </section>

  <section id="tab-messages" class="admin-tab-panel" style="display:none;">
    <div class="admin-card">
      <h2>Unlock messages</h2>
      <p class="admin-hint">Paste your private key below to decrypt messages, right here in this browser. It is never sent to the server or saved anywhere.</p>
      <textarea id="private-key" rows="6" placeholder="-----BEGIN PRIVATE KEY-----"></textarea>
      <div class="form-actions">
        <button id="unlock-btn" type="button">Unlock</button>
      </div>
      <div class="admin-status" id="unlock-status"></div>
    </div>
    <div class="admin-card">
      <h2>Messages</h2>
      <div id="messages-list"></div>
    </div>
  </section>

  <script src="/js/crypto-utils.js"></script>
  <script src="/admin/admin.js"></script>

</body>
</html>
